id: content-strategy
title: Контент-стратегия и производство
summary: >-
  4 скилла + 1 справочник. content-strategy — Searchable/Shareable
  планирование, контентные столпы, приоритизация по формуле, календарь
  60/30/10, ORB-дистрибуция. content-production — 3-режимный конвейер
