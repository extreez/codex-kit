id: de-ai-text
title: Стилевая редактура текста
summary: >-
  writing-anti-ai (claude-scholar, MIT) - универсальная теория шаблонных
  формулировок текста (формульные структуры, em-dash, доверие читателю,
  вариативность длины, англо/китайская таблица клише), синтез. Плюс
  собственный русскоязычный чеклист замен (клише, пустые усилители,
  хеджирование, голые списки, длинное тире) - не внешний источник, а личные
  правила пользователя, интегрированы как основа для русской секции. Один
  скилл, применяется к любому поданному тексту, не только к выводу Claude.
