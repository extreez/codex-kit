id: deployment-readiness
title: Прод-готовность вне привязки к платформе
summary: >-
  Стратегии rollout (rolling/blue-green/canary), Docker-паттерны, CI/CD-стадии,
  health checks, twelve-factor конфиг, откат, чек-лист прод-готовности по
  пяти зонам, плюс структура формального rollout-плана для рискованных релизов.
  Стоит над платформенными deploy-* блоками.
