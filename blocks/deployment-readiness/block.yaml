  тексту (стратегии, Dockerfile-примеры, CI/CD, health checks, откат, чек-лист).
  Дополнено структурой формального rollout-плана из github/awesome-copilot,
  skill devops-rollout-plan (MIT) - для случаев крупнее обычного чек-листа
  (регулируемые/высокорисковые релизы).
