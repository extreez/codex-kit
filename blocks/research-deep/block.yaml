id: research-deep
title: Глубокое исследование вопроса
summary: >-
  Синтез методологии hyperresearch (MIT) - тиры глубины light/full/dissertation,
  patch-never-regenerate, независимость источников, поиск слепых зон, persistent
  vault - упрощённой до файлов codex-kit. Плюс адаптированные своими словами идеи
  из academic-research-skills (CC-BY-NC 4.0): Devil's Advocate с порогом уступки,
  dialogue health monitor, contamination signals. Проверку цитат делегирует
  скиллу fact-check, не переизобретает свою. Пайплайн: декомпозиция вопроса ->
  параллельные research-investigator по подвопросам -> склейка дублирующихся
  источников -> черновик синтеза -> состязательные research-critic -> точечная
  правка research-patcher (только Read+Edit, без Write) -> fact-check черновика
  -> отчёт с секцией "что не покрыто".
suggests: [de-ai-text]
