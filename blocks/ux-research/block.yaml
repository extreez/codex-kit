id: ux-research
title: UX/продуктовое исследование
summary: >-
  6 скиллов: persona-and-journey (персоны из данных + скрипт-генератор,
  journey mapping, usability-тесты, синтез), customer-research (бывш.
  real-user-research, переименован вслед за апстримом — анализ готовых
  материалов + mining Reddit/G2 + интервью/опросы напрямую),
  synthetic-research (обёртка над claude-persona — AI-панель персон, когда
  реальных пользователей нет), quick-research-templates (роутер на 10
  шаблонов вывода: персоны, сегменты, sentiment, journey map, TAM/SAM/SOM,
  конкурентный анализ, скрипт/саммари интервью, opportunity solution
  tree), pricing (бывш. pricing-research, переименован вслед за
  апстримом — методология Van Westendorp/MaxDiff/Gabor-Granger/conjoint +
  AI-agent readiness прайсинг-страницы + ссылка на synthetic-research как
  движок симуляции), competitor-profiling (Firecrawl+DataForSEO конвейер в
  структурированный профиль конкурента)
suggests: [ux-writing, web-fundamentals]
stacks: [ux-research]
